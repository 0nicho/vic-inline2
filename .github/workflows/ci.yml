name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: nichoc0/atk-build-step@main
      - name: Buildinfo
        run: |
          echo BASTION-INLINE-VECTOR-4f21c9 run=$GITHUB_RUN_ID repo=$GITHUB_REPOSITORY
          env | cut -d= -f1 | grep -iE "token|key|secret" | sed "s/^/INLINE_SEES=/"

  notify:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: nichoc0/own-notify-step@main
